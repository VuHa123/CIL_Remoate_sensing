[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my_cil"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "timm",
    "einops",
    "numpy",
    "scipy",
    "scikit-learn",
    "imbalanced-learn",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
